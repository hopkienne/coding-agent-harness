name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          npm test
          npm pack --dry-run

      - name: Ensure release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Publish public package
        run: npm publish --access public --provenance
        env:
          # Needed only for the first publish if npm Trusted Publishing has not
          # yet been configured. Use a granular token with bypass-2FA enabled,
          # then remove this secret after OIDC publishing is verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
